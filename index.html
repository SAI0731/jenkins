<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Brick Breaker</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            color: #00fff2;
            text-shadow: 0 0 10px rgba(0, 255, 242, 0.5);
        }

        .stats-container {
            display: flex;
            gap: 30px;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .stat-box span {
            font-weight: bold;
            color: #00fff2;
        }

        canvas {
            background-color: #0f0f1a;
            border: 3px solid #00fff2;
            box-shadow: 0 0 20px rgba(0, 255, 242, 0.2);
            border-radius: 6px;
            cursor: none;
        }

        .controls-hint {
            margin-top: 15px;
            color: #888;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>BRICK BREAKER</h1>
    <div class="stats-container">
        <div class="stat-box">Score: <span id="score">0</span></div>
        <div class="stat-box">Lives: <span id="lives">3</span></div>
    </div>
    
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    
    <div class="controls-hint">Move your Mouse left/right to control the paddle.<br>Click or press Spacebar to start/restart.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        const livesDisplay = document.getElementById("lives");

        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let isGameOver = false;
        let isVictory = false;

        const paddleHeight = 10;
        const paddleWidth = 75;
        let paddleX = (canvas.width - paddleWidth) / 2;

        const ballRadius = 8;
        let x = canvas.width / 2;
        let y = canvas.height - 30;
        let dx = 3;
        let dy = -3;

        const brickRowCount = 3;
        const brickColumnCount = 5;
        const brickWidth = 75;
        const brickHeight = 20;
        const brickPadding = 10;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 30;
        const brickColors = ["#ff0055", "#ffcc00", "#00ff66"];

        let bricks = [];
        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1, color: brickColors[r] };
                }
            }
        }

        document.addEventListener("mousemove", mouseMoveHandler, false);
        document.addEventListener("keydown", keyDownHandler, false);
        canvas.addEventListener("click", startAction);

        function mouseMoveHandler(e) {
            const relativeX = e.clientX - canvas.offsetLeft;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }

        function keyDownHandler(e) {
            if (e.key === " " || e.key === "Spacebar") {
                startAction();
            }
        }

        function startAction() {
            if (isGameOver || isVictory) {
                score = 0;
                lives = 3;
                isGameOver = false;
                isVictory = false;
                initBricks();
                resetBallAndPaddle();
                isPlaying = true;
            } else if (!isPlaying) {
                isPlaying = true;
            }
        }

        function resetBallAndPaddle() {
            x = canvas.width / 2;
            y = canvas.height - 30;
            dx = 3 * (Math.random() > 0.5 ? 1 : -1);
            dy = -3;
            paddleX = (canvas.width - paddleWidth) / 2;
        }

        function collisionDetection() {
            let activeBricks = 0;
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        activeBricks++;
                        if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score += 10;
                            scoreDisplay.innerText = score;
                        }
                    }
                }
            }
            if (activeBricks === 0 && !isVictory) {
                isVictory = true;
                isPlaying = false;
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#00fff2";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight - 5, paddleWidth, paddleHeight);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                        let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function drawOverlayScreen(title, subtitle, color) {
            ctx.fillStyle = "rgba(15, 15, 26, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = color;
            ctx.font = "bold 28px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);

            ctx.fillStyle = "#fff";
            ctx.font = "15px 'Segoe UI'";
            ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 25);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            if (!isPlaying && !isGameOver && !isVictory) {
                drawOverlayScreen("READY PLAYER ONE", "Click or Press Spacebar to Launch Ball", "#00fff2");
            }
            if (isGameOver) {
                drawOverlayScreen("GAME OVER", "Click or Press Spacebar to Try Again", "#ff0055");
            }
            if (isVictory) {
                drawOverlayScreen("VICTORY ACHIEVED!", "You smashed all bricks! Click to Play Again.", "#00ff66");
            }

            if (!isPlaying) {
                requestAnimationFrame(draw);
                return;
            }

            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
            }
            if (y + dy < ballRadius) {
                dy = -dy;
            } 
            else if (y + dy > canvas.height - ballRadius - paddleHeight - 5) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    let hitPos = (x - (paddleX + paddleWidth / 2)) / (paddleWidth / 2);
                    dx = hitPos * 4; 
                    dy = -dy;
                } else if (y + dy > canvas.height - ballRadius) {
                    lives--;
                    livesDisplay.innerText = lives;
                    if (!lives) {
                        isGameOver = true;
                        isPlaying = false;
                    } else {
                        resetBallAndPaddle();
                        isPlaying = false;
                    }
                }
            }

            x += dx;
            y += dy;
            requestAnimationFrame(draw);
        }

        initBricks();
        draw();
    </script>
</body>
</html>
