<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #00ff88;
        }

        .score-container {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        #score {
            font-weight: bold;
            color: #00ff88;
        }

        canvas {
            background-color: #000;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            border-radius: 4px;
        }

        .controls-hint {
            margin-top: 15px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    <div class="score-container">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls-hint">Use Arrow Keys or WASD to move. Press Space to Restart.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");

        // Grid size configuration
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Game variables
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1; // initial horizontal velocity
        let dy = 0; // initial vertical velocity
        let score = 0;
        let gameInterval;
        let isGameOver = false;

        // Main game loop runner
        function startGame() {
            isGameOver = false;
            score = 0;
            scoreDisplay.innerText = score;
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            generateFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 100);
        }

        // Updates logic frame by frame
        function updateGame() {
            if (isGameOver) return;

            moveSnake();

            if (checkGameOver()) {
                isGameOver = true;
                clearInterval(gameInterval);
                drawGameOver();
                return;
            }

            checkFoodCollision();
            clearCanvas();
            drawFood();
            drawSnake();
        }

        // Clears the canvas frame
        function clearCanvas() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Draws the snake
        function drawSnake() {
            snake.forEach((part, index) => {
                // Head is brighter green, body parts are standard green
                ctx.fillStyle = index === 0 ? "#00ff88" : "#00aa66";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        // Advances the position of the snake
        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head); // Add new head
            snake.pop(); // Remove tail unless eating food
        }

        // Draws the food target
        function drawFood() {
            ctx.fillStyle = "#ff4444";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        // Moves food to a random square
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Ensure food doesn't spawn on top of the snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        // Checks if snake hit food
        function checkFoodCollision() {
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreDisplay.innerText = score;
                // Grow snake by recreating the tail piece we popped off earlier
                snake.push({ ...snake[snake.length - 1] });
                generateFood();
            }
        }

        // Validates wall and self collisions
        function checkGameOver() {
            const head = snake[0];

            // Wall Collisions
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }

            // Self Collisions
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        // Renders Game Over overlay screen
        function drawGameOver() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ff4444";
            ctx.font = "bold 30px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);

            ctx.fillStyle = "#fff";
            ctx.font = "16px 'Segoe UI'";
            ctx.fillText("Press SPACE to Play Again", canvas.width / 2, canvas.height / 2 + 25);
        }

        // Monitors user keystrokes for control inputs
        window.addEventListener("keydown", e => {
            switch(e.key) {
                // Move Up
                case "ArrowUp":
                case "w":
                case "W":
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                // Move Down
                case "ArrowDown":
                case "s":
                case "S":
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                // Move Left
                case "ArrowLeft":
                case "a":
                case "A":
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                // Move Right
                case "ArrowRight":
                case "d":
                case "D":
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
                // Reset game
                case " ":
                    if (isGameOver) startGame();
                    break;
            }
        });

        // Initialize game session on boot
        startGame();
    </script>
</body>
</html>
