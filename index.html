<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber Runner</title>
    <style>
        body {
            background-color: #050510;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 2.5rem;
            color: #ff007f;
            text-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f;
            letter-spacing: 2px;
        }

        .ui-container {
            display: flex;
            gap: 40px;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .ui-box span {
            font-weight: bold;
        }

        #score { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; }
        #shieldStatus { color: #ffe600; text-shadow: 0 0 10px #ffe600; }

        canvas {
            background-color: #0a0a1a;
            border: 3px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.1);
            border-radius: 8px;
        }

        .controls {
            margin-top: 15px;
            color: #777799;
            font-size: 0.95rem;
            text-align: center;
            line-height: 1.5;
        }
        
        .hotkey {
            color: #00f0ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>CYBER RUNNER</h1>
    <div class="ui-container">
        <div class="ui-box">Distance: <span id="score">0m</span></div>
        <div class="ui-box">Shield: <span id="shieldStatus">READY</span></div>
    </div>
    
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    
    <div class="controls">
        Press <span class="hotkey">W / S</span> or <span class="hotkey">Up / Down Arrow</span> to steer.<br>
        Press <span class="hotkey">SPACEBAR</span> to activate Shield when ready.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        const shieldDisplay = document.getElementById("shieldStatus");

        // Game State
        let isPlaying = false;
        let isGameOver = false;
        let score = 0;
        let gameSpeed = 4;
        let originalSpeed = 4;

        // Player Ship Configuration
        const player = {
            x: 80,
            y: 200,
            width: 30,
            height: 20,
            targetY: 200,
            speed: 12,
            hasShield: false,
            shieldCharge: 100, // 0 to 100%
            shieldActiveTime: 0
        };

        // Entities arrays
        let obstacles = [];
        let particles = [];
        let energyCubes = [];

        // Controls Map
        const keys = { ArrowUp: false, ArrowDown: false, w: false, s: false };

        window.addEventListener("keydown", e => {
            if (e.key in keys) keys[e.key] = true;
            if (e.key === " " || e.key === "Spacebar") {
                triggerShield();
            }
        });

        window.addEventListener("keyup", e => {
            if (e.key in keys) keys[e.key] = false;
        });

        canvas.addEventListener("click", () => {
            if (!isPlaying) resetGame();
        });

        function triggerShield() {
            if (!isPlaying && !isGameOver) {
                resetGame();
                return;
            }
            if (isGameOver) {
                resetGame();
                return;
            }
            if (!player.hasShield && player.shieldCharge >= 100) {
                player.hasShield = true;
                player.shieldActiveTime = 180; // lasts 3 seconds (60fps * 3)
                shieldDisplay.innerText = "ACTIVE";
                shieldDisplay.style.color = "#ff007f";
            }
        }

        function resetGame() {
            isPlaying = true;
            isGameOver = false;
            score = 0;
            gameSpeed = originalSpeed;
            player.y = 200;
            player.targetY = 200;
            player.hasShield = false;
            player.shieldCharge = 100;
            obstacles = [];
            particles = [];
            energyCubes = [];
            shieldDisplay.innerText = "READY";
            shieldDisplay.style.color = "#ffe600";
        }

        // Spawning Logic
        function spawnEntities() {
            // Spawn energy pillars (Obstacles)
            if (Math.random() < 0.02 + (gameSpeed * 0.002) && obstacles.length < 5) {
                const h = Math.random() * 120 + 40;
                const isTop = Math.random() > 0.5;
                obstacles.push({
                    x: canvas.width + 50,
                    y: isTop ? 0 : canvas.height - h,
                    width: 25,
                    height: h,
                    type: 'barrier'
                });
            }

            // Spawn neon battery cubes
            if (Math.random() < 0.01 && energyCubes.length < 2) {
                energyCubes.push({
                    x: canvas.width + 30,
                    y: Math.random() * (canvas.height - 60) + 30,
                    size: 15,
                    pulse: 0
                });
            }
        }

        // Particle Engines
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    color: color
                });
            }
        }

        function updateAndDrawEntities() {
            // Background grid lines simulation
            ctx.strokeStyle = "rgba(0, 240, 255, 0.05)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i - ((score * 2) % 40), 0);
                ctx.lineTo(i - ((score * 2) % 40), canvas.height);
                ctx.stroke();
            }

            // Engine trail particles
            if (isPlaying && Math.random() > 0.3) {
                particles.push({
                    x: player.x,
                    y: player.y + player.height / 2,
                    vx: -gameSpeed * 0.5,
                    vy: (Math.random() - 0.5) * 2,
                    radius: Math.random() * 3 + 1,
                    alpha: 0.8,
                    color: player.hasShield ? "#ff007f" : "#00f0ff"
                });
            }

            // Handle Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Handle Obstacles (Neon Pillars)
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                if (isPlaying) o.x -= gameSpeed;

                ctx.shadowBlur = 15;
                ctx.shadowColor = "#ff0055";
                ctx.fillStyle = "#ff0055";
                ctx.fillRect(o.x, o.y, o.width, o.height);
                
                // Neon inner core light effect
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(o.x + 8, o.y, 9, o.height);

                // Collision Logic
                if (isPlaying && 
                    player.x < o.x + o.width &&
                    player.x + player.width > o.x &&
                    player.y < o.y + o.height &&
                    player.y + player.height > o.y) {
                    
                    if (player.hasShield) {
                        createExplosion(o.x + o.width/2, o.y + o.height/2, "#ff0055");
                        obstacles.splice(i, 1);
                        score += 50;
                    } else {
                        isGameOver = true;
                        isPlaying = false;
                        createExplosion(player.x, player.y, "#00f0ff");
                    }
                }

                if (o.x + o.width < 0) obstacles.splice(i, 1);
            }

            // Handle Energy Cubes
            for (let i = energyCubes.length - 1; i >= 0; i--) {
                let c = energyCubes[i];
                if (isPlaying) c.x -= gameSpeed;
                c.pulse += 0.1;

                ctx.shadowBlur = 10 + Math.sin(c.pulse) * 5;
                ctx.shadowColor = "#ffe600";
                ctx.fillStyle = "#ffe600";
                ctx.fillRect(c.x, c.y, c.size, c.size);
                ctx.shadowBlur = 0;

                // Collection Logic
                if (isPlaying &&
                    player.x < c.x + c.size &&
                    player.x + player.width > c.x &&
                    player.y < c.y + c.size &&
                    player.y + player.height > c.y) {
                    
                    createExplosion(c.x, c.y, "#ffe600");
                    energyCubes.splice(i, 1);
                    
                    if (!player.hasShield) {
                        player.shieldCharge = Math.min(100, player.shieldCharge + 35);
		
		}
score += 30;
continue;
}
if (c.x + c.size < 0) energyCubes.splice(i, 1);
}
}
function gameLoop() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
if (isPlaying) {
// Handle Movement Controls
if (keys.ArrowUp || keys.w) player.targetY -= player.speed;
if (keys.ArrowDown || keys.s) player.targetY += player.speed;
// Restrict boundaries
player.targetY = Math.max(10, Math.min(canvas.height - player.height - 10, player.targetY));
// Smooth interpolation ease
player.y += (player.targetY - player.y) * 0.25;
// Manage Shield mechanics
if (player.hasShield) {
player.shieldActiveTime--;
player.shieldCharge = Math.floor((player.shieldActiveTime / 180) * 100);
shieldDisplay.innerText = ACTIVE (${player.shieldCharge}%);
if (player.shieldActiveTime <= 0) {
player.hasShield = false;
player.shieldCharge = 0;
shieldDisplay.innerText = "0%";
shieldDisplay.style.color = "#aaa";
}
} else if (player.shieldCharge < 100) {
player.shieldCharge += 0.05; // Passive trickle recharge
let displayPct = Math.floor(player.shieldCharge);
shieldDisplay.innerText = displayPct === 100 ? "READY" : ${displayPct}%;
shieldDisplay.style.color = displayPct === 100 ? "#ffe600" : "#777799";
}
score++;
scoreDisplay.innerText = ${Math.floor(score / 10)}m;
// Speed ramp up slowly
gameSpeed = originalSpeed + (score * 0.0005);
spawnEntities();
}
updateAndDrawEntities();
// Draw Cyber Ship Player
if (!isGameOver) {
ctx.save();
ctx.shadowBlur = player.hasShield ? 20 : 10;
ctx.shadowColor = player.hasShield ? "#ff007f" : "#00f0ff";
// Core Ship body
ctx.fillStyle = player.hasShield ? "#ff007f" : "#00f0ff";
ctx.beginPath();
ctx.moveTo(player.x, player.y);
ctx.lineTo(player.x + player.width, player.y + player.height / 2);
ctx.lineTo(player.x, player.y + player.height);
ctx.lineTo(player.x + 8, player.y + player.height / 2);
ctx.fill();
// Shield Bubble Overlay
if (player.hasShield) {
ctx.strokeStyle = "rgba(255, 0, 127, 0.6)";
ctx.lineWidth = 2;
ctx.beginPath();
ctx.arc(player.x + player.width/2, player.y + player.height/2, player.width * 0.8, 0, Math.PI * 2);
ctx.stroke();
}
ctx.restore();
}
// Draw Screens Overlays
if (!isPlaying && !isGameOver) {
drawScreenOverlay("NEON RUNNER", "Click Canvas or Press Spacebar to Fly", "#00f0ff");
} else if (isGameOver) {
drawScreenOverlay("SYSTEM CRASHED", Final Record: ${Math.floor(score / 10)}m - Click to reboot engine, "#ff0055");
}
requestAnimationFrame(gameLoop);
}
function drawScreenOverlay(title, subtitle, accentColor) {
ctx.fillStyle = "rgba(5, 5, 16, 0.85)";
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.shadowBlur = 15;
ctx.shadowColor = accentColor;
ctx.fillStyle = accentColor;
ctx.font = "bold 32px 'Segoe UI'";
ctx.textAlign = "center";
ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 15);
ctx.shadowBlur = 0;
ctx.fillStyle = "#8888aa";
ctx.font = "16px 'Segoe UI'";
ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 25);
}
// Launch system
gameLoop();
