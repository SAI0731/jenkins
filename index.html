<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Car Racing</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 2.2rem;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        .score-container {
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        #score {
            font-weight: bold;
            color: #ffcc00;
        }

        canvas {
            background-color: #333;
            border: 4px solid #555;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        .controls-hint {
            margin-top: 15px;
            color: #aaa;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <h1>RETRO RACER</h1>
    <div class="score-container">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="360" height="500"></canvas>
    <div class="controls-hint">Use Left / Right Arrows or A / D to dodge. Space to restart.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");

        // Game Config
        const carWidth = 40;
        const carHeight = 70;
        const lanes =; // Center x positions for 4 lanes

        // State variables
        let playerLane = 1; // Starts in the second lane
        let playerY = canvas.height - carHeight - 20;
        let obstacles = [];
        let score = 0;
        let gameSpeed = 5;
        let spawnTimer = 0;
        let isGameOver = false;
        let animationFrameId;

        function startGame() {
            isGameOver = false;
            score = 0;
            gameSpeed = 5;
            playerLane = 1;
            obstacles = [];
            spawnTimer = 0;
            scoreDisplay.innerText = score;
            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function spawnObstacle() {
            const randomLane = Math.floor(Math.random() * lanes.length);
            // Prevent spawning immediately on top of another obstacle in the same lane
            if (obstacles.length > 0 && obstacles[obstacles.length - 1].y < 150 && obstacles[obstacles.length - 1].lane === randomLane) {
                return;
            }
            
            // Random distinct neon color for enemy cars
            const colors = ["#ff0055", "#00ffcc", "#ff00ff", "#ff6600"];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            obstacles.push({
                lane: randomLane,
                y: -carHeight,
                color: randomColor
            });
        }

        function gameLoop() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Road Features (Moving road lines)
            ctx.fillStyle = "#444";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -score * 2; // Simulates moving road
            
            // Draw lane separators
            for (let i = 1; i < lanes.length; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 90, 0);
                ctx.lineTo(i * 90, canvas.height);
                ctx.stroke();
            }
            ctx.setLineDash([]); // Reset line dash

            // 2. Spawn and Handle Obstacles
            spawnTimer++;
            if (spawnTimer > Math.max(30, 80 - gameSpeed * 3)) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += gameSpeed;

                // Draw enemy car
                ctx.fillStyle = obs.color;
                ctx.fillRect(lanes[obs.lane] - carWidth / 2, obs.y, carWidth, carHeight);
                // Wheels
                ctx.fillStyle = "#000";
                ctx.fillRect(lanes[obs.lane] - carWidth / 2 - 4, obs.y + 10, 4, 15);
                ctx.fillRect(lanes[obs.lane] + carWidth / 2, obs.y + 10, 4, 15);
                ctx.fillRect(lanes[obs.lane] - carWidth / 2 - 4, obs.y + 45, 4, 15);
                ctx.fillRect(lanes[obs.lane] + carWidth / 2, obs.y + 45, 4, 15);

                // Collision Detection
                if (obs.lane === playerLane && obs.y + carHeight > playerY && obs.y < playerY + carHeight) {
                    isGameOver = true;
                }

                // Remove off-screen obstacles and gain points
                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreDisplay.innerText = score;
                    // Gradually increase difficulty speed
                    if (score % 50 === 0) {
                        gameSpeed += 0.8;
                    }
                }
            }

            // 3. Draw Player Car (Yellow Sports Car style)
            let playerX = lanes[playerLane] - carWidth / 2;
            ctx.fillStyle = "#ffcc00"; 
            ctx.fillRect(playerX, playerY, carWidth, carHeight);
            // Cockpit windshield
            ctx.fillStyle = "#cceeff";
            ctx.fillRect(playerX + 5, playerY + 20, carWidth - 10, 15);
            // Wheels
            ctx.fillStyle = "#000";
            ctx.fillRect(playerX - 4, playerY + 10, 4, 15);
            ctx.fillRect(playerX + carWidth, playerY + 10, 4, 15);
            ctx.fillRect(playerX - 4, playerY + 45, 4, 15);
            ctx.fillRect(playerX + carWidth, playerY + 45, 4, 15);

            if (isGameOver) {
                drawGameOver();
            } else {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function drawGameOver() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ff3333";
            ctx.font = "bold 32px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText("CRASHED!", canvas.width / 2, canvas.height / 2 - 10);

            ctx.fillStyle = "#fff";
            ctx.font = "16px 'Segoe UI'";
            ctx.fillText("Press SPACE to Race Again", canvas.width / 2, canvas.height / 2 + 25);
        }

        // Controls input handler
        window.addEventListener("keydown", e => {
            switch(e.key) {
                case "ArrowLeft":
                case "a":
                case "A":
                    if (playerLane > 0 && !isGameOver) playerLane--;
                    break;
                case "ArrowRight":
                case "d":
                case "D":
                    if (playerLane < lanes.length - 1 && !isGameOver) playerLane++;
                    break;
                case " ":
                    if (isGameOver) startGame();
                    break;
            }
        });

        // Initialize setup
        startGame();
    </script>
</body>
</html>
